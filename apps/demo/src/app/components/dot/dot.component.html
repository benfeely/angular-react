<div
  [style.width]="size"
  [style.line-height]="size"
  [style.height]="size"
  [style.left]="x"
  [style.top]="y"
  [style.color]="activeColor.text"
  [style.background-color]="activeColor.bg"
  (mouseenter)="onMouseEnter($event)"
  (mouseleave)="onMouseLeave($event)"
>
  <ng-content></ng-content>
</div>
